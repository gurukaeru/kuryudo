<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ — Kuryudo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+JP:wght@200;300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream:      #F7F3EB;
      --cream-deep: #EDE5D4;
      --gold:       #B8932A;
      --gold-lt:    #D4AE4E;
      --ink:        #1C1814;
      --ink-soft:   #6B5F55;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--cream);
      color: var(--ink);
      font-family: 'Noto Serif JP', serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.3rem 3rem;
      background: rgba(247,243,235,0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(184,147,42,0.12);
    }
    .nav-logo {
      display: flex; align-items: center; gap: .8rem; text-decoration: none;
    }
    .nav-logo img { width: 34px; height: 34px; object-fit: contain; }
    .nav-logo-ja {
      font-family: 'Shippori Mincho', serif; font-weight: 700;
      font-size: 1rem; letter-spacing: .3em; color: var(--ink);
    }
    .nav-logo-en {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: .62rem; letter-spacing: .2em; color: var(--gold);
      display: block; margin-top: .15rem;
    }
    .nav-back {
      font-size: .72rem; font-weight: 300; letter-spacing: .22em;
      color: var(--ink-soft); text-decoration: none;
      display: flex; align-items: center; gap: .55rem;
      transition: color .3s;
    }
    .nav-back::before { content: '←'; }
    .nav-back:hover { color: var(--gold); }

    /* ── MAIN ── */
    .contact-main {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 10rem 5% 6rem;
    }
    .contact-inner {
      width: 100%; max-width: 36rem;
    }

    /* ── HEADING ── */
    .contact-eyebrow {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: .78rem; letter-spacing: .48em; color: var(--gold);
      margin-bottom: 1.6rem;
      opacity: 0; animation: fadeUp 1s ease .2s forwards;
    }
    .contact-title {
      font-family: 'Shippori Mincho', serif; font-weight: 700;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      letter-spacing: .1em; line-height: 1.3;
      color: var(--ink);
      margin-bottom: 1.2rem;
      opacity: 0; animation: fadeUp 1s ease .35s forwards;
    }
    .contact-divider {
      width: 2.4rem; height: 1px;
      background: rgba(184,147,42,0.50);
      margin-bottom: 1.8rem;
      opacity: 0; animation: fadeUp 1s ease .45s forwards;
    }
    .contact-lead {
      font-weight: 300; font-size: .88rem;
      letter-spacing: .1em; line-height: 2.1;
      color: var(--ink-soft);
      margin-bottom: 3.4rem;
      opacity: 0; animation: fadeUp 1s ease .55s forwards;
    }

    /* ── FORM ── */
    .contact-form {
      opacity: 0; animation: fadeUp 1s ease .70s forwards;
    }
    .form-group {
      margin-bottom: 2rem;
    }
    .form-label {
      display: block;
      font-family: 'Shippori Mincho', serif; font-weight: 500;
      font-size: .80rem; letter-spacing: .22em;
      color: var(--ink-soft);
      margin-bottom: .7rem;
    }
    .form-label .required {
      font-size: .62rem; letter-spacing: .1em;
      color: var(--gold); margin-left: .5rem;
    }
    .form-input,
    .form-textarea {
      width: 100%;
      background: rgba(28,24,20,0.03);
      border: 1px solid rgba(28,24,20,0.18);
      border-radius: 0;
      padding: .95rem 1.1rem;
      font-family: 'Noto Serif JP', serif; font-weight: 300;
      font-size: .88rem; letter-spacing: .08em;
      color: var(--ink);
      outline: none;
      transition: border-color .3s, background .3s;
      -webkit-appearance: none;
    }
    .form-input::placeholder,
    .form-textarea::placeholder {
      color: rgba(28,24,20,0.28);
    }
    .form-input:focus,
    .form-textarea:focus {
      border-color: rgba(184,147,42,0.65);
      background: rgba(28,24,20,0.05);
    }
    .form-textarea {
      resize: vertical;
      min-height: 10rem;
      line-height: 2;
    }

    /* ── SUBMIT ── */
    .form-submit {
      width: 100%;
      margin-top: .8rem;
      padding: 1.1rem;
      background: var(--ink);
      border: 1px solid var(--ink);
      color: var(--cream);
      font-family: 'Shippori Mincho', serif; font-weight: 700;
      font-size: .88rem; letter-spacing: .3em;
      cursor: pointer;
      transition: background .3s, color .3s, border-color .3s;
    }
    .form-submit:hover {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--cream);
    }
    .form-submit:disabled {
      opacity: .5; cursor: not-allowed;
    }

    /* ── SUCCESS / ERROR ── */
    .form-message {
      display: none;
      margin-top: 1.6rem;
      padding: 1.2rem 1.4rem;
      font-family: 'Shippori Mincho', serif; font-weight: 500;
      font-size: .84rem; letter-spacing: .1em; line-height: 1.9;
      border-left: 2px solid var(--gold);
      color: var(--ink-soft);
      background: rgba(184,147,42,0.08);
    }
    .form-message.is-visible { display: block; }

    /* ── ANIMATION ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      nav { padding: 1.1rem 1.4rem; }
      .nav-logo-en { display: none; }
      .contact-main { padding: 8rem 6% 5rem; }
    }

    footer {
      background: var(--cream);
      padding: 3rem 5rem;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      gap: .4rem;
      border-top: 1px solid rgba(184,147,42,.15);
    }
    .footer-img { height: 160px; width: auto; object-fit: contain; }
    .footer-copy { font-size: .7rem; font-weight: 300; letter-spacing: .12em; color: var(--ink-soft); }
  </style>
</head>
<body>

<nav>
  <a href="kuryudo_v3.html" class="nav-logo">
    <img src="image/栗人ロゴGOLD透過.png" alt="栗人">
    <div>
      <span class="nav-logo-ja">栗人</span>
      <span class="nav-logo-en">Kuryudo · from Minamisoma with pride</span>
    </div>
  </a>
  <a href="kuryudo_v3.html" class="nav-back">内なる獣と生きる</a>
</nav>

<main class="contact-main">
  <div class="contact-inner">
    <p class="contact-eyebrow">Contact · お問い合わせ</p>
    <h1 class="contact-title">お問い合わせ</h1>
    <div class="contact-divider"></div>
    <p class="contact-lead">
      ご質問・ご相談など、お気軽にご連絡ください。<br>
      内容を確認次第、担当よりご返信いたします。
    </p>

    <!--
      【送信設定について】
      Web3Forms（無料サービス）を使用しています。
      送信を有効にするには以下の手順が必要です：

      1. https://web3forms.com にアクセス
      2. 「mantakuri@gmail.com」を入力して Access Key を取得
      3. 届いたメールのリンクをクリックして確認
      4. 下記 <input name="access_key"> の value を取得した Key に置き換える
    -->
    <form
      class="contact-form"
      id="contact-form"
      action="https://api.web3forms.com/submit"
      method="POST"
    >
      <!-- Web3Forms 設定 -->
      <input type="hidden" name="access_key" value="e5833c63-40f6-4ba7-ba80-2c92e58d3916">
      <input type="hidden" name="subject" value="【栗人】お問い合わせが届きました">
      <input type="hidden" name="from_name" value="栗人 Kuryudo">
      <input type="hidden" name="botcheck" value="">

      <!-- お名前 -->
      <div class="form-group">
        <label class="form-label" for="name">
          お名前<span class="required">必須</span>
        </label>
        <input
          class="form-input"
          type="text"
          id="name"
          name="name"
          required
          placeholder="山田 太郎"
          autocomplete="name"
        >
      </div>

      <!-- メールアドレス -->
      <div class="form-group">
        <label class="form-label" for="email">
          メールアドレス<span class="required">必須</span>
        </label>
        <input
          class="form-input"
          type="email"
          id="email"
          name="email"
          required
          placeholder="example@email.com"
          autocomplete="email"
        >
      </div>

      <!-- お問い合わせ内容 -->
      <div class="form-group">
        <label class="form-label" for="message">
          お問い合わせ内容<span class="required">必須</span>
        </label>
        <textarea
          class="form-textarea"
          id="message"
          name="message"
          required
          placeholder="ご質問・ご相談内容をご記入ください。"
        ></textarea>
      </div>

      <button type="submit" class="form-submit" id="submit-btn">
        送信する
      </button>

      <div class="form-message" id="form-success">
        お問い合わせを受け付けました。<br>
        内容を確認のうえ、担当よりご連絡いたします。
      </div>
      <div class="form-message" id="form-error">
        送信に失敗しました。<br>
        時間をおいて再度お試しいただくか、<br>
        直接 mantakuri@gmail.com へご連絡ください。
      </div>
    </form>
  </div>
</main>

<footer>
  <img src="image/栗人ロゴGOLD透過.png" alt="栗人" class="footer-img">
  <p class="footer-copy">© 2026 栗人 Kuryudo. All rights reserved.</p>
</footer>

<script>
  const form   = document.getElementById('contact-form');
  const btn    = document.getElementById('submit-btn');
  const success = document.getElementById('form-success');
  const error   = document.getElementById('form-error');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = '送信中…';
    success.classList.remove('is-visible');
    error.classList.remove('is-visible');

    try {
      const res = await fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        body: new FormData(form)
      });
      const data = await res.json();

      if (data.success) {
        success.classList.add('is-visible');
        form.reset();
        btn.textContent = '送信完了';
      } else {
        throw new Error(data.message);
      }
    } catch (err) {
      error.classList.add('is-visible');
      btn.disabled = false;
      btn.textContent = '送信する';
    }
  });
</script>
</body>
</html>
